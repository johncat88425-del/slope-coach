name: Static demo (GitHub Pages)

# Builds the demo-only frontend (VITE_DEMO_ONLY=1): it replays the saved
# records in data/demo/ and never calls the backend or any model API.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b && npx vite build --base=/${{ github.event.repository.name }}/
        working-directory: frontend
        env:
          VITE_DEMO_ONLY: "1"
          VITE_LIVE_URL: ${{ vars.VITE_LIVE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
