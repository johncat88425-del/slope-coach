<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muse v1.3 UI fixture</title></head><body><main class="audit-layout"><section id="workspace"><h1>Muse v1.3 UI fixture</h1><p>UI fixture only — no API or model call. Original measurement values are read from the saved demo record.</p><div class="fields"><label>Case<select id="case"><option value="fit">Matched object and conditional model explanation</option><option value="retake">Uncertain object and model retake tips</option><option value="legacy">Legacy record without new fields</option></select></label><label>Language<select id="language"><option value="en">English</option><option value="zh">中文</option></select></label></div><div id="fixture"></div></section></main>
<script type="module">
import '../src/style.css';import '../src/editorial.css';import {createElement as h} from 'react';import {createRoot} from 'react-dom/client';import raw from '../../data/demo/generated_meta_clip4.json?raw';import {AuditResult} from '../src/AuditPage.tsx';import {LanguageProvider} from '../src/i18n.tsx';
const saved=JSON.parse(raw),root=createRoot(document.querySelector('#fixture'));
function show(){const mode=document.querySelector('#case').value,language=document.querySelector('#language').value;let audit={...saved};
if(mode==='fit')audit={...saved,track_check:{source:'model',same_object:true,note:'The same object is followed through the selected segment.'},what_would_fit:{source:'model',text:`If the clip were retimed by a factor of ${saved.numbers.implied_time_factor}, it would fit this model under that assumption.`}};
if(mode==='retake')audit={...saved,verdict:'insufficient_data',numbers:{},headline:null,explanation:undefined,track_check:{source:'model',same_object:false,note:'The track may follow another object.'},retake_tips:['Keep one clear object visible throughout the motion.','Check the overlay before recording again.'],what_would_fit:null,reasons:['Muse Spark re-check: the tracker may have followed another object.']};
document.documentElement.lang=language==='zh'?'zh-Hant':'en';root.render(h(LanguageProvider,{value:language},h(AuditResult,{audit,replay:true})));}
document.querySelector('#case').onchange=show;document.querySelector('#language').onchange=show;show();
</script></body></html>
